---
id: app.drey.Warp
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
command: warp
finish-args:
  # X11 and Wayland
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  # OpenGL rendering
  - --device=dri
  # Share files over the network
  - --share=network
  # Save files in the Downloads directory
  - --filesystem=xdg-download
  # Inhibit shutdown and sleep
  - --system-talk-name=org.freedesktop.login1
modules:
  - name: zbar
    config-opts:
      - --disable-doc
      - --disable-video
      - --enable-codes=qrcode
      - --without-dbus
      - --without-directshow
      - --without-gir
      - --without-graphicsmagick
      - --without-gtk
      - --without-imagemagick
      - --without-jpeg
      - --without-java
      - --without-npapi
      - --without-python
      - --without-qt
      - --without-qt5
      - --without-xshm
      - --without-xv
    sources:
      - type: archive
        url: https://github.com/mchehab/zbar/archive/refs/tags/0.23.93.tar.gz
        sha256: 212dfab527894b8bcbcc7cd1d43d63f5604a07473d31a5f02889e372614ebe28
        x-checker-data:
          type: anitya
          project-id: 13689
          stable-only: true
          url-template: https://github.com/mchehab/zbar/archive/refs/tags/$version.tar.gz
      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -vfi -W none
  - name: gst-bad-plugins
    buildsystem: meson
    config-opts:
      - -Dzbar=enabled
      - -Drsvg=disabled
      - -Dvulkan=disabled
      - -Dexamples=disabled
      - -Dtests=disabled
      - -Dintrospection=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.24.11.tar.xz
        sha256: 9126c2b7053a5f059db958f43c6a5230d2e843ff9adff8c8c2477ea2457e3315
        x-checker-data:
          type: anitya
          project-id: 21849
          stable-only: true
          url-template: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-$version.tar.xz
  - name: warp
    buildsystem: meson
    config-opts:
      - -Dprofile=default
      - -Dqr-code-scanning=enabled
    sources:
      - type: archive
        url: https://gitlab.gnome.org/World/warp/-/archive/v0.8.1/warp-v0.8.1.tar.gz
        sha256: c47693522f6e6571bdce5b5bbbc31e35d382dc9777dfe81b93ba5501c9944318
        x-checker-data:
          type: git
      # generated via flatpak-builder-tools
      - cargo-sources.json
      - type: shell
        commands:
          - mkdir .cargo
          - cp cargo/config .cargo/
